name: Waldbrand-Daten aktualisieren

on:
  schedule:
    # Zweimal täglich: 6:00 Uhr und 11:00 Uhr (UTC) = ca. 8:00 / 13:00 MESZ
    # Hinweis: GitHub Actions startet Cron-Jobs oft mit bis zu 30 Min. Verzögerung
    - cron: "0 6 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch: # manueller Start jederzeit möglich

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests beautifulsoup4 lxml

      - name: Daten abrufen und JSON erzeugen
        run: python scripts/fetch_waldbrand.py

      - name: Änderungen committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/waldbrand.json
          git diff --cached --quiet || git commit -m "chore: Waldbrand-Daten aktualisiert ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
