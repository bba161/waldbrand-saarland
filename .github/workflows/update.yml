name: Waldbrand-Daten aktualisieren

on:
  schedule:
    # 5:00 UTC = 7:00 MESZ (6:00 MEZ)
    # GitHub Actions kann bis zu 60 Min. Verzögerung haben –
    # daher früh genug starten, damit die Daten vor 8 Uhr bereitstehen.
    - cron: "0 5 * * *"
    # Zweiter Abruf: 10:00 UTC = 12:00 MESZ
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests beautifulsoup4 lxml

      - name: Daten abrufen und JSON erzeugen
        run: python scripts/fetch_waldbrand.py

      - name: Änderungen committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/waldbrand.json
          git diff --cached --quiet || git commit -m "chore: Waldbrand-Daten aktualisiert ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
